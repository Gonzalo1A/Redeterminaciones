<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <title>TODO supply a title</title>
        <meta charset="windows-1252">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
                    </head>
                    <body>

                        <header th:replace="fragments/header"></header>
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th scope="col">*</th>
                                    <th scope="col">VR</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <th class="table-primary" scope="row" >1</th>
                                    <td></td>
                                </tr>
                                <tr>
                                    <th scope="row"></th>
                                    <td class="table-success" th:text=${valorReferencia}></td>
                                </tr>
                            </tbody>
                        </table>
                        <button id="redeterminar" th:if="${valorReferencia > 10}" type="button" th:data-name="${nombreObra}" class="btn btn-success" onclick="mostrarTabla()">Success</button>
                        <table id="tablaResumen" class="table table-striped" style="display: none;">
                            <thead>
                                <tr >
                                    <th scope="col">Item</th>
                                    <th scope="col">Descripcion</th>
                                    <th scope="col">Unidad</th>
                                    <th scope="col">C/U viejo</th>
                                    <th scope="col">Subtotal</th>
                                    <th scope="col">Factor Redet</th>
                                    <th scope="col">C/U Nuevo</th>
                                    <th scope="col">Remanente Teo</th>
                                    <th scope="col">Remanente Real</th>
                                    <th scope="col">Min R-T y R-R</th>
                                    <th scope="col">Incremento SubT</th>
                                    <th scope="col">Nuevo SubTotal</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpoTabla">
                                <!-- Aquí se cargarán dinámicamente las filas -->
                            </tbody>
                        </table>
                        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
                        <script src="/js/redeterminacion.js"></script>
                    </body>
                    </html>
