<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <title>TODO supply a title</title>
        <meta charset="windows-1252">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
                    </head>
                    <body>

                        <header th:replace="fragments/header"></header>
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th scope="col">*</th>
                                    <th scope="col">VR</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <th class="table-primary" scope="row" >1</th>
                                    <td></td>
                                </tr>
                                <tr>
                                    <th scope="row"></th>
                                    <td class="table-success" th:text=${valorReferencia}></td>
                                </tr>
                            </tbody>
                        </table>
                        <button id="redeterminar" th:if="${valorReferencia > 1}" type="button" th:data-name="${nombreObra}" class="btn btn-success" onclick="mostrarTabla()">Success</button>
                        <table id="tablaResumen" class="table table-striped" style="display: none;">
                            <thead>
                                <tr >
                                    <th scope="col">Item</th>
                                    <th scope="col">Descripcion</th>
                                    <th scope="col">Unidad</th>
                                    <th scope="col">C/U viejo</th>
                                    <th scope="col">Subtotal</th>
                                    <th scope="col">Factor Redet</th>
                                    <th scope="col">C/U Nuevo</th>
                                    <th scope="col">Remanente Teo</th>
                                    <th scope="col">Remanente Real</th>
                                    <th scope="col">Min R-T y R-R</th>
                                    <th scope="col">Incremento SubT</th>
                                    <th scope="col">Nuevo SubTotal</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpoTabla">
                                <!-- Aquí se cargarán dinámicamente las filas -->
                            </tbody>
                        </table>
                        <div>
                            <form th:action="@{/calculo/descargar_resumen/__${nombreObra}__}" method="get">
                                <input hidden name="idRedet" th:value="${idRedet}">
                                    <button type="submit" class="btn btn-outline-danger">
                                        Descargar 
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download" viewBox="0 0 16 16">
                                            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                                            <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"/>
                                        </svg>
                                    </button>
                            </form>
                        </div>
                        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
                        <script src="/js/redeterminacion.js"></script>
                    </body>
                    </html>
